name: Deploy

on:
  push:
    tags:
      - "v*"

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, auth, file, mail]
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and push Docker image
        run: |
          TAG_WITHOUT_V=${TAG#v}
          docker build -t ghcr.io/${{ github.repository }}:${{ matrix.service }}-$TAG_WITHOUT_V -t ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest -f ./src/${{ matrix.service }}/Dockerfile ./src/${{ matrix.service }}
          docker push ghcr.io/${{ github.repository }}:${{ matrix.service }}-$TAG_WITHOUT_V
          docker push ghcr.io/${{ github.repository }}:${{ matrix.service }}-latest

  deploy:
    if: ${{ vars.DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "latest"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: "latest"

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" > $HOME/.kube/config

      - name: Deploy with Helm
        run: |
          helm upgrade --install cloud-storage ./k8s -f ./k8s/values-prod.yaml --namespace cloud-storage --create-namespace
          kubectl rollout restart deployment -n cloud-storage

      - name: Verify deployment
        run: kubectl rollout status deployment -n cloud-storage --timeout=5m
