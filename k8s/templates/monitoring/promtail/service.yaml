{{- if .Values.monitoring.enabled }}
{{- $promtailName := include "cloud-storage.promtail.fullname" . -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $promtailName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: promtail
    {{- include "cloud-storage.labels" . | nindent 4 }}
spec:
  selector:
    app: promtail
  ports:
  - name: http
    port: 9080
    targetPort: http
  type: ClusterIP
{{- end }}
