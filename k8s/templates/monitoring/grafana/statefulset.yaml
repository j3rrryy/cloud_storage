{{- if .Values.monitoring.enabled }}
{{- $grafanaName := include "cloud-storage.grafana.fullname" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $grafanaName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: grafana
    {{- include "cloud-storage.labels" . | nindent 4 }}
spec:
  serviceName: {{ $grafanaName }}
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: {{ .Values.grafana.image }}
        ports:
        - containerPort: {{ .Values.grafana.service.port }}
          name: http
        env:
        - name: GF_SERVER_ROOT_URL
          value: {{ printf "%s://%s/admin/grafana" (include "cloud-storage.ingress.scheme" .) .Values.ingress.host | quote }}
        {{- range $key, $val := .Values.grafana.env }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        envFrom:
        - secretRef:
            name: {{ $grafanaName }}-secret
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-datasources
          mountPath: /etc/grafana/provisioning/datasources
        readinessProbe:
          httpGet:
            path: /admin/grafana/api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.grafana.resources | nindent 10 }}
      volumes:
      - name: grafana-datasources
        configMap:
          name: {{ $grafanaName }}-datasources
  volumeClaimTemplates:
  - metadata:
      name: grafana-data
      labels:
        {{- include "cloud-storage.labels" . | nindent 8 }}
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: {{ .Values.grafana.storage }}
{{- end }}
