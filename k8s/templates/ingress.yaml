{{- if .Values.ingress.enabled }}
{{- $gatewayName := include "cloud-storage.gateway.fullname" . -}}
{{- $grafanaName := include "cloud-storage.grafana.fullname" . -}}
{{- $minioName := include "cloud-storage.minio.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloud-storage.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/server-snippet: |
      location /api/metrics { return 403; }
      location /api/health { return 403; }
      location /s3-files {
        client_max_body_size 75M;
        proxy_set_header Authorization "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_redirect off;
        proxy_pass http://{{ $minioName }}.{{ .Release.Namespace }}:{{ .Values.minio.service.port }};
      }
      {{- if .Values.monitoring.enabled }}
      location /admin/grafana {
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
        proxy_pass http://{{ $grafanaName }}.{{ .Release.Namespace }}:{{ .Values.grafana.service.port }};
      }
      {{- end }}
    {{- if .Values.monitoring.enabled }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    {{- end }}
    {{- range $key, $val := .Values.ingress.annotations }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.ingress.host }}
    secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ $gatewayName }}
            port:
              number: {{ .Values.gateway.service.httpPort }}
{{- end }}
