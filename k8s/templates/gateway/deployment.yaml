apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-storage.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "cloud-storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: "{{ .Values.global.image.repository }}:{{ .Values.gateway.image.tag }}"
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.gateway.service.httpPort }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "cloud-storage.gateway.fullname" . }}-config
        livenessProbe:
          httpGet:
            path: /api/health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
