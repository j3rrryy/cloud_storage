apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloud-storage.file.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: file
    {{- include "cloud-storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.file.replicaCount }}
  selector:
    matchLabels:
      app: file
  template:
    metadata:
      labels:
        app: file
    spec:
      containers:
      - name: file
        image: "{{ .Values.global.image.repository }}:{{ .Values.file.image.tag }}"
        imagePullPolicy: {{ .Values.global.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.file.service.grpcPort }}
          name: grpc
        - containerPort: {{ .Values.file.service.httpPort }}
          name: http
        envFrom:
        - configMapRef:
            name: {{ include "cloud-storage.file.fullname" . }}-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: file-postgres
              key: password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: file-redis
              key: password
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-minio
              key: rootUser
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-minio
              key: rootPassword
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 3
          periodSeconds: 5
        resources:
          {{- toYaml .Values.file.resources | nindent 10 }}
