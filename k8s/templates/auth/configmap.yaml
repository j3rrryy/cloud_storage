apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloud-storage.auth.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: auth
    {{- include "cloud-storage.labels" . | nindent 4 }}
data:
  {{- range $key, $val := .Values.auth.env }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
  POSTGRES_HOST: {{ .Release.Name }}-auth-postgres
  POSTGRES_PORT: "5432"
  REDIS_HOST: {{ .Release.Name }}-auth-redis-master
  REDIS_PORT: "6379"
